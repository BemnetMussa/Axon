  <g transform="translate(130 130) scale(10.5)" fill="#fafafa">
    <circle cx="5" cy="5" r="1.5" opacity="0.43"/>
    <circle cx="12" cy="5" r="1.5" opacity="0.55"/>
    <circle cx="5" cy="12" r="1.5" opacity="0.3"/>
    <circle cx="12" cy="12" r="1.5" opacity="0.43"/>
    <circle cx="19" cy="12" r="1.5" opacity="0.55"/>
    <circle cx="5" cy="19" r="1.5" opacity="0.18"/>
    <circle cx="12" cy="19" r="1.5" opacity="0.3"/>
    <circle cx="19" cy="19" r="1.5" opacity="0.43"/>
    <circle cx="19" cy="5" r="3.3"/>
  </g>
</svg>
