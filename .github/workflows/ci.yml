name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      # Dummy values: app.main hard-fails without an internal secret, and the
      # Groq client requires a key at import time. Tests never call Groq.
      AXON_INTERNAL_SECRET: ci-test-secret
      GROQ_API_KEY: gsk_ci_dummy_key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run tests
        run: python -m pytest
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    env:
      # Auth module hard-requires these at import time during `npm run build`.
      BETTER_AUTH_SECRET: ci-test-better-auth-secret
      GOOGLE_CLIENT_ID: ci-test-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      AXON_INTERNAL_SECRET: ci-test-secret
      DATABASE_URL: postgresql://axon:axon123@127.0.0.1:5432/axon_db
      BETTER_AUTH_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fronted

      - name: Type check
        run: npx svelte-check --tsconfig ./tsconfig.json
        working-directory: fronted

      - name: Unit tests
        run: npm test
        working-directory: fronted

      - name: Build
        run: npm run build
        working-directory: fronted
